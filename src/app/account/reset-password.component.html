<style>
.neon-container {
    background-color: #0b0c10;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', Courier, monospace; /* Or another monospace/tech font */
    color: #c5c6c7;
    margin: -15px; /* offset typical padding if inside another card */
}
.neon-card {
    background-color: #12151e;
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border: 1px solid #1f2533;
    overflow: hidden;
}
.neon-header {
    padding: 25px;
    text-align: center;
    border-bottom: 1px solid #1f2533;
    background: linear-gradient(180deg, rgba(0,255,255,0.05) 0%, rgba(18,21,30,1) 100%);
}
.neon-title {
    color: #00ffff;
    font-size: 1.2rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    margin: 0;
}
.neon-body {
    padding: 30px 25px;
}
.neon-label {
    display: block;
    color: #6c757d;
    font-size: 0.8rem;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-transform: uppercase;
}
.neon-input {
    width: 100%;
    background-color: #1a1f2e;
    border: 1px solid #1f2533;
    color: #fff;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 5px;
    font-family: inherit;
    outline: none;
    transition: all 0.3s;
}
.neon-input:focus {
    border-color: #00ffff;
    box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
}
.neon-btn {
    background-color: #12151e;
    color: #00ffff;
    border: 1px solid #00ffff;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    font-family: inherit;
    width: 100%;
    margin-bottom: 15px;
}
.neon-btn:hover:not(:disabled) {
    background-color: rgba(0, 255, 255, 0.1);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
}
.neon-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.neon-cancel {
    color: #6c757d;
    text-decoration: none;
    font-size: 0.9rem;
    display: inline-block;
    margin-top: 5px;
}
.neon-cancel:hover {
    color: #fff;
}
.neon-text-center {
    text-align: center;
}
.neon-status-msg {
    color: #00ffff;
    font-size: 0.9rem;
    text-align: center;
    padding: 20px;
}
.neon-error-msg {
    color: #dc3545;
    font-size: 0.9rem;
    text-align: center;
    padding: 20px;
}
.neon-error-msg a {
    color: #00ffff;
    text-decoration: underline;
}
</style>

<div class="neon-container">
    <div class="neon-card">
        <div class="neon-header">
            <h3 class="neon-title">Reset Password</h3>
        </div>
        
        <div class="neon-body">
            <div *ngIf="tokenStatus == TokenStatus.Validating" class="neon-status-msg">
                Validating token...
            </div>
            
            <div *ngIf="tokenStatus == TokenStatus.Invalid" class="neon-error-msg">
                Token validation failed, if the token has expired you can get a new one at the <a routerLink="../forgot-password">forgot password</a> page.
            </div>
            
            <form *ngIf="tokenStatus == TokenStatus.Valid" [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="mb-4" style="margin-bottom: 1.5rem;">
                    <label class="neon-label">Password</label>
                    <input type="password" formControlName="password" class="neon-input" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
                    <div *ngIf="submitted && f.password.errors" class="text-danger mt-1" style="color: #dc3545; font-size: 0.8rem;">
                        <div *ngIf="f.password.errors.required">Password is required</div>
                        <div *ngIf="f.password.errors.minlength">Password must be at least 6 characters</div>
                    </div>
                </div>
                
                <div class="mb-4" style="margin-bottom: 1.5rem;">
                    <label class="neon-label">Confirm Password</label>
                    <input type="password" formControlName="confirmPassword" class="neon-input" [ngClass]="{ 'is-invalid': submitted && f.confirmPassword.errors }" />
                    <div *ngIf="submitted && f.confirmPassword.errors" class="text-danger mt-1" style="color: #dc3545; font-size: 0.8rem;">
                        <div *ngIf="f.confirmPassword.errors.required">Confirm Password is required</div>
                        <div *ngIf="f.confirmPassword.errors.mustMatch">Passwords must match</div>
                    </div>
                </div>
                
                <div style="margin-top: 25px;">
                    <button [disabled]="loading" class="neon-btn">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" style="width: 1rem; height: 1rem; border-width: 0.15em; margin-right: 8px;"></span>
                        Reset Password
                    </button>
                    <div class="neon-text-center">
                        <a routerLink="../login" class="neon-cancel">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
