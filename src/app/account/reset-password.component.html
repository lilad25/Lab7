<div class="neon-wrapper">
    <div class="neon-card">
        <h2 class="neon-title">RESET PASSWORD</h2>
        
        <div class="neon-body">
            <div *ngIf="tokenStatus == TokenStatus.Validating" class="neon-status-msg">
                Validating token...
            </div>
            
            <div *ngIf="tokenStatus == TokenStatus.Invalid" class="neon-status-msg error">
                Token validation failed, if the token has expired you can get a new one at the <a routerLink="../forgot-password">forgot password</a> page.
            </div>
            
            <form *ngIf="tokenStatus == TokenStatus.Valid" [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="neon-form-group">
                    <label>PASSWORD</label>
                    <input type="password" formControlName="password" class="neon-input" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
                    <div *ngIf="submitted && f.password.errors" class="neon-invalid-feedback">
                        <div *ngIf="f.password.errors.required">Password is required</div>
                        <div *ngIf="f.password.errors.minlength">Password must be at least 6 characters</div>
                    </div>
                </div>
                
                <div class="neon-form-group">
                    <label>CONFIRM PASSWORD</label>
                    <input type="password" formControlName="confirmPassword" class="neon-input" [ngClass]="{ 'is-invalid': submitted && f.confirmPassword.errors }" />
                    <div *ngIf="submitted && f.confirmPassword.errors" class="neon-invalid-feedback">
                        <div *ngIf="f.confirmPassword.errors.required">Confirm Password is required</div>
                        <div *ngIf="f.confirmPassword.errors.mustMatch">Passwords must match</div>
                    </div>
                </div>
                
                <div class="neon-form-actions">
                    <button [disabled]="loading" class="neon-btn">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
                        RESET PASSWORD
                    </button>
                    <a routerLink="../login" class="neon-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .neon-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b0f19;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1050;
    }
    
    .neon-card {
        background-color: #121826;
        border-radius: 12px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        border: 1px solid #1a2235;
        border-top: 3px solid #00f0ff;
        overflow: hidden;
    }
    
    .neon-title {
        color: #00f0ff;
        text-align: center;
        margin: 0;
        padding: 30px 20px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        border-bottom: 1px solid #1a2235;
    }
    
    .neon-body {
        padding: 30px;
    }
    
    .neon-form-group {
        margin-bottom: 25px;
    }
    
    .neon-form-group label {
        display: block;
        color: #8b9bb4;
        font-size: 12px;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
        font-weight: 600;
    }
    
    .neon-input {
        width: 100%;
        background-color: transparent;
        border: 1px solid #1a2235;
        border-radius: 6px;
        padding: 12px 15px;
        color: #fff;
        font-size: 16px;
        outline: none;
        transition: all 0.3s ease;
    }
    
    .neon-input:focus {
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        border-color: #00f0ff;
    }
    
    .neon-input.is-invalid {
        border-color: #ff3366;
    }
    
    .neon-invalid-feedback {
        color: #ff3366;
        font-size: 12px;
        margin-top: 5px;
    }
    
    .neon-form-actions {
        display: flex;
        align-items: center;
        gap: 15px;
    }
    
    .neon-btn {
        background-color: transparent;
        color: #00f0ff;
        border: 1px solid #00f0ff;
        padding: 12px 30px;
        border-radius: 6px;
        font-weight: 600;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .neon-btn:hover {
        background-color: rgba(0, 240, 255, 0.1);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    
    .neon-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    
    .neon-cancel {
        color: #8b9bb4;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s ease;
    }
    
    .neon-cancel:hover {
        color: #fff;
    }
    
    .neon-status-msg {
        color: #00f0ff;
        text-align: center;
        padding: 20px;
        font-size: 16px;
        text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
    }
    
    .neon-status-msg.error {
        color: #ff3366;
        text-shadow: 0 0 5px rgba(255, 51, 102, 0.3);
    }
    
    .neon-status-msg.error a {
        color: #fff;
        text-decoration: underline;
    }
</style>
