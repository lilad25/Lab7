<style>
.neon-container {
    background-color: #0b0c10;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', Courier, monospace; /* Or another monospace/tech font */
    color: #c5c6c7;
    margin: -15px; /* offset typical padding if inside another card */
}
.neon-card {
    background-color: #12151e;
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border: 1px solid #1f2533;
    overflow: hidden;
}
.neon-header {
    padding: 25px;
    text-align: center;
    border-bottom: 1px solid #1f2533;
    background: linear-gradient(180deg, rgba(0,255,255,0.05) 0%, rgba(18,21,30,1) 100%);
}
.neon-title {
    color: #00ffff;
    font-size: 1.2rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    margin: 0;
}
.neon-body {
    padding: 30px 25px;
}
.neon-label {
    display: block;
    color: #6c757d;
    font-size: 0.8rem;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-transform: uppercase;
}
.neon-input {
    width: 100%;
    background-color: #1a1f2e;
    border: 1px solid #00ffff;
    color: #fff;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 5px;
    font-family: inherit;
    outline: none;
}
.neon-input:focus {
    box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
}
.neon-btn {
    background-color: #12151e;
    color: #00ffff;
    border: 1px solid #00ffff;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    font-family: inherit;
}
.neon-btn:hover:not(:disabled) {
    background-color: rgba(0, 255, 255, 0.1);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
}
.neon-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.neon-cancel {
    color: #6c757d;
    text-decoration: none;
    margin-left: 15px;
    font-size: 0.9rem;
}
.neon-cancel:hover {
    color: #fff;
}
.neon-text-center {
    text-align: center;
}
.lock-icon {
    font-size: 3rem;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}
.neon-link-box {
    background-color: #1a1f2e;
    border: 1px solid #00ffff;
    border-radius: 6px;
    padding: 15px;
    margin: 20px 0;
    word-break: break-all;
    color: #00ffff;
    font-size: 0.9rem;
    line-height: 1.4;
}
.neon-note {
    color: #6c757d;
    font-size: 0.8rem;
    line-height: 1.5;
}
</style>

<div class="neon-container">
    <div class="neon-card">
        <div class="neon-header">
            <h3 class="neon-title">Forgot Password</h3>
        </div>
        
        <div class="neon-body" *ngIf="!resetLink">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="mb-4" style="margin-bottom: 1.5rem;">
                    <label class="neon-label">Email</label>
                    <input type="text" formControlName="email" class="neon-input" [ngClass]="{ 'is-invalid': submitted && f.email.errors }" />
                    <div *ngIf="submitted && f.email.errors" class="text-danger mt-1" style="color: #dc3545; font-size: 0.8rem;">
                        <div *ngIf="f.email.errors.required">Email is required</div>
                        <div *ngIf="f.email.errors.email">Email is invalid</div>
                    </div>
                </div>
                <div class="d-flex align-items-center">
                    <button [disabled]="loading" class="neon-btn">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1" style="width: 1rem; height: 1rem; border-width: 0.15em;"></span>
                        Submit
                    </button>
                    <a routerLink="../login" class="neon-cancel">Cancel</a>
                </div>
            </form>
        </div>

        <div class="neon-body neon-text-center" *ngIf="resetLink">
            <div class="lock-icon">🔐</div>
            <h3 class="neon-title" style="margin-bottom: 15px; font-size: 1rem;">Reset Link Generated</h3>
            <p style="color: #c5c6c7; font-size: 0.9rem;">Click the link below to reset your password:</p>
            
            <div class="neon-link-box">
                <a [href]="resetLink" style="color: #00ffff; text-decoration: none;">{{resetLink}}</a>
            </div>
            
            <p class="neon-note">NOTE: In a real app this link would be sent to your email.</p>
            
            <div style="margin-top: 20px;">
                <a routerLink="../login" class="neon-cancel" style="margin: 0;">Back to Login</a>
            </div>
        </div>
    </div>
</div>
