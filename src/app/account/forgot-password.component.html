<div class="neon-wrapper">
    <div class="neon-card">
        <h2 class="neon-title">FORGOT PASSWORD</h2>
        
        <div class="neon-body">
            <form *ngIf="!resetLink" [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="neon-form-group">
                    <label>EMAIL</label>
                    <input type="text" formControlName="email" class="neon-input" [ngClass]="{ 'is-invalid': submitted && f.email.errors }" />
                    <div *ngIf="submitted && f.email.errors" class="neon-invalid-feedback">
                        <div *ngIf="f.email.errors.required">Email is required</div>
                        <div *ngIf="f.email.errors.email">Email is invalid</div>
                    </div>
                </div>
                
                <div class="neon-form-actions">
                    <button [disabled]="loading" class="neon-btn">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
                        SUBMIT
                    </button>
                    <a routerLink="../login" class="neon-cancel">Cancel</a>
                </div>
            </form>

            <div *ngIf="resetLink" class="neon-generated-container">
                <div class="neon-icon">🔐</div>
                <h3 class="neon-subtitle">RESET LINK GENERATED</h3>
                <p class="neon-text">Click the link below to reset your password:</p>
                
                <div class="neon-link-box">
                    <a [href]="resetLink">{{resetLink}}</a>
                </div>
                
                <p class="neon-note">NOTE: In a real app this link would be sent to your email.</p>
            </div>
        </div>
    </div>
</div>

<style>
